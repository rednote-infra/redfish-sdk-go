name: CI
on:
  pull_request:
  push:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validation:
    name: Go validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Static analysis
        run: go vet ./...
      - name: Run every offline test with the race detector
        shell: bash
        run: |
          set -euo pipefail
          go test -race -json -shuffle=on -count=1 -coverprofile=coverage.out ./... | tee test-results.jsonl
          # Package-level skips mean there are no test files; reject skipped test cases.
          if grep -Eq '"Action":"skip".*"Test":' test-results.jsonl; then
            echo "Offline test cases must not be skipped." >&2
            exit 1
          fi
          # A successful run must execute at least one test case.
          grep -Eq '"Action":"pass".*"Test":' test-results.jsonl
      - name: Build all packages and examples
        run: go build ./...
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.out
            test-results.jsonl
          if-no-files-found: error
